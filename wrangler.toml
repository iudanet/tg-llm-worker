name = "tg-llm-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# KV для истории диалогов (создан командой wrangler kv namespace create DATABASE).
kv_namespaces = [
    { binding = "DATABASE", id = "ВАШ_KV_NAMESPACE_ID" },
]

[vars]
CHAT_MODEL = "gpt-4.1-mini"
# Список Telegram user id через запятую. Пустой список = бот никого не обслуживает.
# Свой Telegram user id можно узнать у @userinfobot.
CHAT_WHITE_LIST = ""
HISTORY_MAX_MESSAGES = "20"
HISTORY_TTL_SECONDS = "604800"
STREAM_INTERVAL_MS = "1200"
DOCUMENT_THRESHOLD = "4096"
USE_RICH_MESSAGES = "true"
# SYSTEM_PROMPT = "Ты полезный ассистент. Отвечай по-русски."

# Секреты задаются отдельно, НЕ в этом файле:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put OPENAI_API_KEY
