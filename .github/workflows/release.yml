name: Release

on:
  push:
    tags: ['v*']

# Тег может быть пересоздан вручную; не даём двум прогонам спорить за релиз.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Тег не должен публиковаться, если проверки не проходят.
      - run: npm run check

      - name: Resolve version
        id: meta
        run: |
          # Версия берётся из тега: v0.2.0 -> 0.2.0.
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build worker bundle
        run: |
          # Версия и коммит вкомпилируются в бандл: в Workers нет доступа
          # к package.json в рантайме.
          npx wrangler deploy --dry-run --outdir dist \
            --define __APP_VERSION__:'"${{ steps.meta.outputs.version }}"' \
            --define __APP_COMMIT__:'"${{ steps.meta.outputs.commit }}"'

      - name: Prepare release assets
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="tg-llm-worker-${TAG}"
          mkdir -p release "bundle/${NAME}"

          # Отдельный .js — чтобы открыть и вставить в редактор воркера
          # в дашборде Cloudflare без распаковки.
          cp dist/index.js "release/${NAME}.js"

          # Архив — для варианта «развернуть у себя»: бандл, шаблон конфига
          # и документация в одном комплекте.
          cp dist/index.js "bundle/${NAME}/worker.js"
          cp wrangler.toml.example "bundle/${NAME}/"
          cp README.md LICENSE "bundle/${NAME}/"
          tar -czf "release/${NAME}.tar.gz" -C bundle "${NAME}"

          cd release
          sha256sum ./* > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Установка

            ### Вариант 1: из исходников

            ```bash
            git clone https://github.com/iudanet/tg-llm-worker
            cd tg-llm-worker
            git checkout ${{ steps.meta.outputs.tag }}
            npm ci
            cp wrangler.toml.example wrangler.toml   # подставить свои значения
            npx wrangler deploy
            ```

            ### Вариант 2: архивом

            `tg-llm-worker-${{ steps.meta.outputs.tag }}.tar.gz` — собранный
            воркер вместе с шаблоном конфига и документацией.

            ### Вариант 3: одним файлом в дашборд

            `tg-llm-worker-${{ steps.meta.outputs.tag }}.js` — тот же бандл
            отдельным файлом: открыть и вставить в редактор воркера в дашборде
            Cloudflare, без распаковки.

            В обоих случаях после загрузки нужно задать привязки, иначе
            воркер не запустится:

            - KV namespace `DATABASE`;
            - переменные из `wrangler.toml.example` (секция `[vars]`);
            - секреты `TELEGRAM_BOT_TOKEN`, `TELEGRAM_WEBHOOK_SECRET`,
              `OPENAI_API_KEY`.

            Затем открыть `https://<worker>.workers.dev/init?token=<секрет>`,
            чтобы привязать webhook и опубликовать меню команд.

            Контрольные суммы — в `SHA256SUMS.txt`.
