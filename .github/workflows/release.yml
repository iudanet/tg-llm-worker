name: Release

on:
  push:
    tags: ['v*']

# Тег может быть пересоздан вручную; не даём двум прогонам спорить за релиз.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      # Actions запинены по SHA: у этой джобы contents: write, и подмена
      # подвижного тега дала бы чужому коду право писать в релизы.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Тег не должен публиковаться, если проверки не проходят.
      - run: npm run check

      - name: Resolve version
        id: meta
        run: |
          # Версия берётся из тега: v0.2.0 -> 0.2.0.
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build worker bundle
        run: |
          # wrangler.toml в .gitignore, а без конфига wrangler не находит
          # entry point и принимает проект за статический сайт.
          cp wrangler.toml.example wrangler.toml
          # Версия и коммит вкомпилируются в бандл: в Workers нет доступа
          # к package.json в рантайме.
          npx wrangler deploy --dry-run --outdir dist \
            --define __APP_VERSION__:'"${{ steps.meta.outputs.version }}"' \
            --define __APP_COMMIT__:'"${{ steps.meta.outputs.commit }}"'

      - name: Prepare release assets
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="tg-llm-worker-${TAG}"
          mkdir -p release "bundle/${NAME}"

          # Отдельный .js — чтобы открыть и вставить в редактор воркера
          # в дашборде Cloudflare без распаковки.
          cp dist/index.js "release/${NAME}.js"

          # Архив — для варианта «развернуть у себя»: бандл, шаблон конфига
          # и документация в одном комплекте.
          cp dist/index.js "bundle/${NAME}/worker.js"
          cp wrangler.toml.example "bundle/${NAME}/"
          cp README.md LICENSE "bundle/${NAME}/"
          tar -czf "release/${NAME}.tar.gz" -C bundle "${NAME}"

          cd release
          sha256sum ./* > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      # Бандл собирается из исходников и секретов содержать не должен, но
      # ошибка в define или новый импорт это изменят — проверяем явно.
      - name: Verify assets carry no secrets
        run: |
          if grep -rEq 'sk-[A-Za-z0-9_-]{20,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{32,}' release/; then
            echo 'В релизных артефактах найден секрет — публикация отменена' >&2
            exit 1
          fi
          echo 'Секретов в артефактах нет'

      # Встроенный gh вместо стороннего action: у джобы contents: write,
      # и лишняя зависимость здесь — ненужный риск supply chain.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" release/* \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            --notes-file .github/release-notes.md
